declaration:
  call: declare
  version: 0.1
  description: "List all scraped source files with pagination and sorting"
  method: get
  accepts: json
  returns: json
  namespace: source_file
  allowlist:
    params:
      - field: sourceId
        type: string
        description: "Source ID to filter by (optional)"
      - field: page
        type: number
        description: "Page number for pagination"
      - field: pageSize
        type: number
        description: "Number of items per page"
      - field: sorting
        type: string
        description: "Sorting criteria (url asc/desc, page_title asc/desc, excluded asc/desc, status asc/desc, last_scraped_at asc/desc)"

extractRequestData:
  assign:
    source_id: "${incoming.params.sourceId}"
    page: "${incoming.params.page ?? 1}"
    page_size: "${incoming.params.pageSize ?? 10}"
    sorting: "${incoming.params.sorting ?? 'last_scraped_at desc'}"

getScrapedSourceFiles:
  call: http.get
  args:
    url: "[#CKB_RESQL]/source_file/list_scraped_source_files"
    query:
      source_id: ${source_id}
      page: ${page}
      page_size: ${page_size}
      sorting: ${sorting}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
