declaration:
  call: declare
  version: 0.1
  description: "Delete a source file by base ID"
  method: post
  accepts: json
  returns: json
  namespace: source_file
  allowlist:
    body:
      - field: baseId
        type: string
        description: "Base ID of the source file to delete"

extractRequestData:
  assign:
    base_id: "${incoming.body.baseId}"

deleteSourceFile:
  call: http.post
  args:
    url: "[#CKB_RESQL]/source_file/delete_source_file"
    headers:
      type: json
    body:
      base_id: ${base_id}
  result: res

returnSuccess:
  return: ${res.response.body}
  next: end
