declaration:
  call: declare
  version: 0.1
  description: "Delete a source by base ID"
  method: post
  accepts: json
  returns: json
  namespace: source
  allowlist:
    body:
      - field: baseId
        type: string
        description: "Base ID of the source to delete"

extractRequestData:
  assign:
    base_id: "${incoming.body.baseId}"

deleteSourceFromDatabase:
  call: http.post
  args:
    url: "[#CKB_RESQL]/source/delete_source"
    headers:
      type: json
    body:
      base_id: ${base_id}
  result: deleteDbResult

deleteSourceFilesFromS3:
  call: http.post
  args:
    url: "[#CKB_FILE_MANAGER]/delete-files-async"
    headers:
      type: json
    body:
      files:
        - s3_path: "${deleteDbResult.response.body[0].agencyBaseId}/${base_id}/"
          is_folder: true
      callback:
        url: "[#CKB_RUUTER_INTERNAL]/agency/update-zip-dirty"
        method: "POST"
        body:
          agencyId: "${deleteDbResult.response.body[0].agencyBaseId}"
  result: deleteS3Result

assignResponse:
  assign:
    response:
      s3_delete_task_id: ${deleteS3Result.response.body.task_id}
      s3_delete_status: ${deleteS3Result.response.body.status}
      message: "Source deleted from database and S3 deletion task started"

returnSuccess:
  return: ${response}
  next: end
