
services:
  database:
    container_name: database
    image: postgres:14.1
    environment:
      - POSTGRES_USER=byk
      - POSTGRES_PASSWORD=01234
      - POSTGRES_DB=ckb_db
    ports:
      - 5432:5432
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - bykstack

  resql-users:
    container_name: resql-users
    image: resql
    depends_on:
      - database
    environment:
      - server.port=8088
      - sqlms.datasources.[0].name=byk
      # - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://database:5432/users_db // For Local Use
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://171.22.247.13:5433/byk
      - sqlms.datasources.[0].username=byk
      - sqlms.datasources.[0].password=2nH09n6Gly
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8088:8088
    volumes:
      - ./DSL/Resql:/DSL
    networks:
      - bykstack

  resql-ckb:
    container_name: resql-ckb
    image: resql
    depends_on:
      - database
    environment:
      - server.port=8090
      - sqlms.datasources.[0].name=byk
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://database:5432/ckb_db
      - sqlms.datasources.[0].username=byk
      - sqlms.datasources.[0].password=01234
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8090:8090
    volumes:
       - ./DSL/Resql:/DSL
    networks:
      - bykstack

  ruuter-public:
    container_name: ruuter-public
    image: ruuter
    environment:
      - application.cors.allowedOrigins=http://localhost:8086,http://localhost:3001,http://localhost:3003,http://localhost:3004,http://localhost:8080
      - application.httpCodesAllowList=200,201,202,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8086
    volumes:
      - ./DSL/Ruuter.public:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 8086:8086
    networks:
      - bykstack
    cpus: "0.5"
    mem_limit: "512M"

  ruuter-private:
    container_name: ruuter-private
    image: ruuter
    environment:
      - application.cors.allowedOrigins=http://localhost:8089
      - application.httpCodesAllowList=200,201,202,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8089
      - application.externalAuthAllowed=
    volumes:
      - ./DSL/Ruuter.private:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 8089:8089
    networks:
      - bykstack
    cpus: "0.5"
    mem_limit: "512M"

  data-mapper:
    container_name: data-mapper
    image: data-mapper
    environment:
      - PORT=3005
      - CONTENT_FOLDER=/data
    volumes:
      - ./DSL:/data
      - ./DSL/DMapper/ckb/hbs:/workspace/app/views/ckb
      - ./DSL/DMapper/ckb/js:/workspace/app/js/ckb
    ports:
      - 3005:3005
    networks:
      - bykstack

  data-export:
    container_name: data-export
    build:
      context: ./data-export
      dockerfile: Dockerfile
    ports:
      - 8888:8888
    depends_on:
      - database
    environment:
      - DB_URI=postgresql://byk:01234@database:5432/services_db
    command: python debug.py
    volumes:
      - ./DSL/Export:/DSL
      - ./data-export:/app
      - ./exported-data:/exported-data
    networks:
      - bykstack

  ckb-gui:
    container_name: ckb-gui
    build:
      context: ./GUI
      target: build
    ports:
      - 3001:3001
    networks:
      - bykstack

  cron-manager:
    container_name: cron-manager
    image: cron-manager
    # user: root # This root user is only for local development due to multi container mounted volume permissions
    volumes:
      - ./DSL/CronManager:/DSL
    environment:
      - server.port=9010
    ports:
      - 9010:9010
    networks:
      - bykstack

  scrapper-server:
    container_name: scrapper-server
    build:
      context: ./scrapper
      target: server
    ports:
      - 8080:8080
    volumes:
      - ./scrapped-data:/scrapped-data
      - ./scrapper:/app
    environment:
      - RUUTER_PRIVATE=http://ruuter-private:8089
      - BROKER_URL=pyamqp://admin:admin@rabbit-scrapper/scrapper
    depends_on:
      - rabbit-scrapper
    networks:
      - bykstack

  scrapper-celery:
    container_name: scrapper-celery
    build:
      context: ./scrapper
      target: celery
    volumes:
      - ./scrapped-data:/scrapped-data
      - ./scrapper:/app
    environment:
      - RUUTER_PRIVATE=http://ruuter-private:8089
      - BROKER_URL=pyamqp://admin:admin@rabbit-scrapper/scrapper
    depends_on:
      - rabbit-scrapper
    networks:
      - bykstack

  cleaning-server:
    container_name: cleaning-server
    build:
      context: ./cleaning
      target: server
    ports:
      - 8123:8123
    volumes:
      - ./scrapped-data:/scrapped-data
      - ./cleaning:/app
    environment:
      - RUUTER_PRIVATE=http://ruuter-private:8089
      - BROKER_URL=pyamqp://admin:admin@rabbit-cleaning/cleaning
    depends_on:
      - rabbit-cleaning
    networks:
      - bykstack

  cleaning-celery:
    container_name: cleaning-celery
    build:
      context: ./cleaning
      target: celery
    volumes:
      - ./scrapped-data:/scrapped-data
      - ./cleaning:/app
    environment:
      - RUUTER_PRIVATE=http://ruuter-private:8089
      - BROKER_URL=pyamqp://admin:admin@rabbit-cleaning/cleaning
    depends_on:
      - rabbit-cleaning
    networks:
      - bykstack

  rabbit-cleaning:
    image: rabbitmq:4-management
    container_name: rabbit-cleaning
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_DEFAULT_VHOST=cleaning
    ports:
      - "5692:5672"
      - "15692:15672"
    networks:
      - bykstack

  rabbit-scrapper:
    image: rabbitmq:4-management
    container_name: rabbit-scrapper
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_DEFAULT_VHOST=scrapper
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - bykstack

networks:
  bykstack:
    name: bykstack
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
